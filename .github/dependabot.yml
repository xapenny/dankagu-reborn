version: 2
updates:
  # Python dependencies, resolved through uv.lock.
  #
  # Minor and patch updates are grouped into a single pull request; major
  # updates are deliberately excluded from the group so each arrives on its
  # own and has to be read before merging. A passing CI suite is not proof
  # that a major bump is safe: the suite only covers the code paths it
  # exercises, and Dependabot itself runs no tests.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by .github/workflows/ci.yml. Pinned to commit SHAs in
  # that file; Dependabot understands SHA pins and will propose new SHAs while
  # preserving the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
