name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# CI only ever reads the repository.
permissions:
  contents: read

# A newer push to the same ref cancels the previous, still-running CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail loudly if uv.lock drifts from pyproject.toml instead of silently
  # resolving something that was never tested locally.
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: dankagu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs rather than mutable major tags,
      # so the code CI runs cannot change underneath it. The trailing comment
      # records the release each SHA corresponds to; Dependabot keeps both the
      # SHA and that comment up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        # `--extra dev` pulls pytest, pytest-asyncio, httpx, ruff and mypy.
        run: uv sync --extra dev

      - name: Fetch and compile protocol schemas
        # Neither protos/ nor src/dankagu/grpc/generated/ is tracked: the
        # schemas are third-party content and the stubs are build output.
        # Both are recreated here from the upstream project. No token is
        # needed for the public repository.
        run: uv run python scripts/compile_protos.py --fetch

      - name: Run test suite
        env:
          DANKAGU_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dankagu
        run: uv run pytest -q

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Fetch and compile protocol schemas
        # Required so ruff can resolve imports that reach the generated stubs.
        run: uv run python scripts/compile_protos.py --fetch

      - name: Ruff lint
        # --output-format=github renders findings inline on the pull request.
        run: uv run ruff check --output-format=github src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint and zizmor catch what no Python test can: a workflow file is
      # not imported by anything in tests/, so a green test suite says nothing
      # about it. Both are pinned release tarballs verified against their
      # published SHA-256, so no third-party action executes here.
      #
      # To refresh a pin: bump the version, then take the new hash from the
      # GitHub release's asset digest (or actionlint's checksums.txt asset).
      # Dependabot cannot track these two URLs, so this is a manual bump.
      - name: Install actionlint 1.7.12 (checksum verified)
        run: |
          set -euo pipefail
          AL_VERSION=1.7.12
          AL_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Install zizmor 1.30.1 (checksum verified)
        run: |
          set -euo pipefail
          ZZ_VERSION=1.30.1
          ZZ_SHA256=e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZZ_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZZ_SHA256}  zizmor.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/zizmor
          tar -xzf zizmor.tar.gz -C /tmp/zizmor
          install -m 0755 /tmp/zizmor/zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        # Persona-aware audit of every workflow. Findings are the purpose of
        # the job, so a non-zero exit fails CI.
        run: zizmor --persona auditor .github/workflows

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Fetch and compile protocol schemas
        # Without this the wheel would contain no gRPC stubs and could not be
        # imported, so the artifact would not represent a working install.
        run: uv run python scripts/compile_protos.py --fetch

      - name: Build sdist and wheel
        # Catches packaging regressions in the hatchling configuration.
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
