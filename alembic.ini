# Alembic configuration for dankagu-reborn.
#
# The database URL is deliberately NOT stored here: `src/dankagu/db/migrations/env.py`
# injects `dankagu.config.settings.db_url`, so credentials keep living in `.env`
# (DANKAGU_DB_URL) and never enter version control.
#
# Normal use is through the application entrypoint:
#     python -m dankagu.db.migrate --upgrade     (bootstrap + upgrade, advisory-locked)
#     python -m dankagu.db.migrate --current
# The plain `alembic` CLI also works from the repository root and is what CI uses
# for the upgrade/downgrade/`check` smoke test.

[alembic]
# `pkg:dir` form keeps the migration scripts inside the installed package, so a
# built wheel can migrate a database without the source tree next to it.
script_location = dankagu.db:migrations
prepend_sys_path = src

# Treat prepend_sys_path as os.pathsep-separated (Alembic 1.16+); without this
# the legacy space/comma/colon splitting is used and warns.
path_separator = os

# Revision <-> schema version table. Single row, written only by Alembic.
version_table = alembic_version

# Keep autogenerated file names stable across machines.
file_template = %%(rev)s_%%(slug)s

# NOTE: no `timezone = UTC` here on purpose. Resolving a timezone name needs the
# tzdata database, which a bare Windows Python does not ship; the option only
# affects how the "Create Date" comment is rendered, so local time is fine.

# sqlalchemy.url is injected at runtime (see env.py); left blank on purpose.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
