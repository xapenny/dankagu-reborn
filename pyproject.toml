[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dankagu-reborn"
version = "0.1.0"
description = "Touhou Danmaku Kagura (ダンカグ) Backend Preservation Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "白鷺シオナ" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "aiofiles>=24.1.0",
    "pyjwt[crypto]>=2.9.0",
    "capstone>=5.0.9",
    "unitypy>=1.25.3",
    "flatbuffers>=25.12.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
dankagu = "dankagu.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dankagu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/dankagu/grpc/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
